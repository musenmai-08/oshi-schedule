name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: oshi_schedule_test
          MYSQL_USER: oshi
          MYSQL_PASSWORD: oshi_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://oshi:oshi_password@127.0.0.1:3306/oshi_schedule_test
      TEST_DATABASE_URL: mysql://oshi:oshi_password@127.0.0.1:3306/oshi_schedule_test
      APP_MODE: fake
      ALLOWED_EMAILS: developer@example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to integration database
        run: pnpm exec prisma migrate deploy
      - name: Check migration status and schema drift
        run: |
          pnpm exec prisma migrate status
          pnpm exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and MySQL integration tests
        run: pnpm test
      - run: pnpm build
      - name: Validate OpenAPI and deployment YAML
        run: >-
          pnpm validate:yaml --
          docs/api/openapi.yaml
          amplify.yml
          .github/workflows/ci.yml
          .github/workflows/deploy-staging.yml
          .github/workflows/deploy-production.yml
      - name: CDK assertions and synth
        run: |
          pnpm --filter @oshi-schedule/infra test
          pnpm --filter @oshi-schedule/infra synth
      - name: Build production container
        run: docker build --tag oshi-schedule:ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
