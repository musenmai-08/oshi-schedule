name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Reserved, non-routable values used only to validate the production Web build contract.
  # Playwright overrides API URL and demo mode with its local fake-service values.
  WEB_ORIGIN: https://web.ci.example.invalid
  NEXT_PUBLIC_API_URL: https://api.ci.example.invalid
  NEXT_PUBLIC_DEMO_MODE: 'false'
  NEXT_PUBLIC_SUPABASE_URL: https://supabase.ci.example.invalid
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_secret

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oshi_schedule_test
          POSTGRES_USER: oshi
          POSTGRES_PASSWORD: oshi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U oshi -d oshi_schedule_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://oshi:oshi_password@127.0.0.1:5432/oshi_schedule_test?schema=app
      TEST_DATABASE_URL: postgresql://oshi:oshi_password@127.0.0.1:5432/oshi_schedule_test?schema=app
      APP_MODE: fake
      ALLOWED_EMAILS: developer@example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate expiring Trivy exceptions
        run: pnpm validate:trivy-ignore
      - name: Apply migrations to integration database
        run: pnpm exec prisma migrate deploy
      - name: Check migration status and schema drift
        run: |
          pnpm exec prisma migrate status
          pnpm exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and PostgreSQL integration tests
        run: pnpm test
      - name: Build with safe public CI configuration
        run: pnpm build
      - name: Validate OpenAPI and deployment YAML
        run: >-
          pnpm validate:yaml --
          docs/api/openapi.yaml
          amplify.yml
          .github/workflows/ci.yml
          .github/workflows/deploy-staging.yml
          .github/workflows/deploy-production.yml
          .github/workflows/backup-production.yml
          .github/workflows/backup-staging.yml
      - name: CDK assertions and synth
        run: |
          pnpm --filter @oshi-schedule/infra test
          pnpm --filter @oshi-schedule/infra synth
      - name: Build production container
        run: docker build --pull --platform linux/amd64 --tag oshi-schedule:ci .
      - name: Validate production container runtime contract
        run: pnpm validate:runtime-image -- oshi-schedule:ci
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oshi-schedule:ci
          format: table
          exit-code: '1'
          cache: 'false'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_WEB_PORT: '3310'
      E2E_API_PORT: '4310'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build E2E workspace dependencies
        run: pnpm --filter @oshi-schedule/shared build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
