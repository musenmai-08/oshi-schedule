name: Deploy staging serverless

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CUTOVER_STAGING_SERVERLESS
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging-serverless
  cancel-in-progress: false

jobs:
  ci:
    if: inputs.confirm == 'CUTOVER_STAGING_SERVERLESS'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: inputs.confirm == 'CUTOVER_STAGING_SERVERLESS'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN }}
      DATABASE_MIGRATION_URL_SECRET_ARN: ${{ vars.STAGING_DATABASE_MIGRATION_URL_SECRET_ARN }}
      CDK_CONTEXT_JSON: ${{ vars.STAGING_SERVERLESS_CDK_CONTEXT_JSON }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: oshi-schedule-staging-serverless-${{ github.run_id }}
      - name: Apply PostgreSQL migrations once
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$DATABASE_MIGRATION_URL_SECRET_ARN" --query SecretString --output text)"
          test -n "$DATABASE_URL" && test "$DATABASE_URL" != None
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL DIRECT_URL="$DATABASE_URL"
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
      - name: Deploy serverless stack
        run: node scripts/aws/serverless-deploy.mjs deploy staging "$CDK_CONTEXT_JSON"
