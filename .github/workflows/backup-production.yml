name: Backup production database

on:
  schedule:
    - cron: '15 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backup-production-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKUP_ROLE_ARN: ${{ vars.PRODUCTION_DATABASE_BACKUP_ROLE_ARN }}
      DATABASE_MIGRATION_URL_SECRET_ARN: ${{ vars.PRODUCTION_DATABASE_MIGRATION_URL_SECRET_ARN }}
      BACKUP_BUCKET: ${{ vars.PRODUCTION_DATABASE_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_BACKUP_ROLE_ARN }}
          role-session-name: oshi-schedule-backup-${{ github.run_id }}
      - name: Validate non-secret configuration
        run: |
          for name in AWS_REGION AWS_BACKUP_ROLE_ARN DATABASE_MIGRATION_URL_SECRET_ARN BACKUP_BUCKET; do
            test -n "${!name}" || { echo "Missing backup configuration: $name" >&2; exit 1; }
          done
      - name: Dump app schema and upload encrypted backup
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d -p "$RUNNER_TEMP" oshi-schedule-backup-XXXXXX)"
          trap 'rm -rf "$work"; unset DATABASE_URL PSQL_DATABASE_URL' EXIT
          DATABASE_URL="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$DATABASE_MIGRATION_URL_SECRET_ARN" \
            --query SecretString \
            --output text)"
          test -n "$DATABASE_URL" && test "$DATABASE_URL" != None || {
            echo 'Database migration URL is unavailable' >&2
            exit 1
          }
          echo "::add-mask::$DATABASE_URL"
          PSQL_DATABASE_URL="$(PRISMA_DATABASE_URL="$DATABASE_URL" node scripts/database/libpq-url.mjs)"
          test -n "$PSQL_DATABASE_URL" || {
            echo 'Could not derive a libpq-compatible database URL' >&2
            exit 1
          }
          echo "::add-mask::$PSQL_DATABASE_URL"
          export PSQL_DATABASE_URL
          docker run --rm --env DATABASE_URL="$PSQL_DATABASE_URL" --volume "$work:/backup" postgres:17-alpine \
            sh -c 'set -eu; pg_dump --dbname "$DATABASE_URL" --schema app --format custom --no-owner --no-privileges --file /backup/app.dump; pg_restore --list /backup/app.dump >/dev/null; psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --csv --command "SELECT migration_name, checksum FROM app._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name" > /backup/state.csv'
          node scripts/database/migration-state.mjs create-backup "$work/state.csv" "$work/migrations.json" "$GITHUB_SHA"
          prefix="database/$(date -u +%Y/%m/%d)/app-$(date -u +%Y%m%dT%H%M%SZ)"
          aws s3 cp "$work/app.dump" "s3://$BACKUP_BUCKET/$prefix.dump" \
            --only-show-errors --sse AES256
          aws s3 cp "$work/migrations.json" "s3://$BACKUP_BUCKET/$prefix.migrations.json" \
            --only-show-errors --sse AES256
          aws s3api head-object --bucket "$BACKUP_BUCKET" --key "$prefix.dump" \
            --query '{size:ContentLength,encryption:ServerSideEncryption}' --output json
          aws s3api head-object --bucket "$BACKUP_BUCKET" --key "$prefix.migrations.json" \
            --query '{size:ContentLength,encryption:ServerSideEncryption}' --output json
