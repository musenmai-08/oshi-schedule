openapi: 3.1.0
info:
  title: 推しスケジュール API
  version: 1.3.0
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    SubscriptionId:
      in: path
      name: subscriptionId
      required: true
      schema: { $ref: '#/components/schemas/Cuid' }
    SyncRunId:
      in: path
      name: syncRunId
      required: true
      schema: { $ref: '#/components/schemas/Cuid' }
  schemas:
    Cuid:
      type: string
      pattern: '^c[a-z0-9]{8,}$'
      examples: [cm0wz73bk0000qzrmn831i7rn]
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              properties:
                nextRetryAt: { type: string, format: date-time }
              additionalProperties: false
        requestId: { type: string }
    Handle:
      type: object
      required: [handle]
      properties: { handle: { type: string, pattern: '^@[A-Za-z0-9._-]{3,30}$' } }
    ProviderToken:
      type: object
      required: [providerRefreshToken]
      properties:
        providerRefreshToken: { type: string, minLength: 1, writeOnly: true }
    CreateChannel:
      type: object
      required: [youtubeChannelId]
      properties: { youtubeChannelId: { type: string, minLength: 1 } }
    ChannelRegistrationResult:
      type: object
      required: [subscription, sync]
      properties:
        subscription:
          type: object
          required: [id, status]
          properties:
            id: { $ref: '#/components/schemas/Cuid' }
            status: { type: string, enum: [ACTIVE, PAUSED] }
        sync:
          type: object
          required: [id, subscriptionId, status]
          properties:
            id: { $ref: '#/components/schemas/Cuid' }
            subscriptionId: { $ref: '#/components/schemas/Cuid' }
            status: { type: string, enum: [QUEUED, RUNNING, FAILED] }
            errorCode: { type: string }
    SyncRunAccepted:
      type: object
      required: [id, subscriptionId, status]
      properties:
        id: { $ref: '#/components/schemas/Cuid' }
        subscriptionId: { $ref: '#/components/schemas/Cuid' }
        status: { type: string, enum: [QUEUED, RUNNING] }
    SyncRun:
      type: object
      required:
        [id, subscriptionId, trigger, status, queuedAt, startedAt, finishedAt, error, result]
      properties:
        id: { $ref: '#/components/schemas/Cuid' }
        subscriptionId: { $ref: '#/components/schemas/Cuid' }
        trigger: { type: string, enum: [INITIAL, MANUAL] }
        status:
          type: string
          enum:
            [QUEUED, RUNNING, SUCCESS, FAILED, DEFERRED, PARTIAL_SUCCESS, PARTIAL_FAILED, SKIPPED]
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: [string, 'null'] }
        result:
          type: object
          required: [youtubeFetch, databaseUpdate, calendarSync, snapshotVersion]
          properties:
            youtubeFetch: { type: string, enum: [NOT_STARTED, SUCCESS, DEFERRED, FAILED, SKIPPED] }
            databaseUpdate:
              { type: string, enum: [NOT_STARTED, SUCCESS, DEFERRED, FAILED, SKIPPED] }
            calendarSync: { type: string, enum: [NOT_STARTED, SUCCESS, DEFERRED, FAILED, SKIPPED] }
            snapshotVersion: { type: [integer, 'null'], minimum: 0 }
    UpdateSubscription:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ACTIVE, PAUSED] } }
    DeleteConfirmation:
      type: object
      required: [confirmation]
      properties: { confirmation: { type: string, const: DELETE } }
    SyncResult:
      type: object
      required: [status, broadcasts, snapshotVersion, phases]
      properties:
        status: { type: string, enum: [SUCCESS, DEFERRED] }
        broadcasts: { type: integer, minimum: 0 }
        snapshotVersion: { type: integer, minimum: 0 }
        phases:
          type: object
          required: [youtubeFetch, databaseUpdate, calendarSync]
          properties:
            youtubeFetch: { type: string, enum: [SUCCESS, DEFERRED, FAILED, SKIPPED] }
            databaseUpdate: { type: string, enum: [SUCCESS, DEFERRED, FAILED, SKIPPED] }
            calendarSync: { type: string, enum: [SUCCESS, DEFERRED, FAILED, SKIPPED] }
        nextRetryAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: validation error, missing body, or malformed JSON
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: not invited
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: account deletion is pending or complete
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: resource or API route not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: request body exceeds 32 KiB
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: rate limit, cooldown, or application quota limit
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: unexpected internal error without implementation details
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
security: [{ bearerAuth: [] }]
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: healthy oshi-schedule API instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, service]
                    properties:
                      status: { type: string, const: ok }
                      service: { type: string, const: oshi-schedule-api }
  /ready:
    get:
      security: []
      responses:
        '200':
          description: API is ready to serve requests and the database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, service]
                    properties:
                      status: { type: string, const: ready }
                      service: { type: string, const: oshi-schedule-api }
        '503':
          description: API process is alive but a required dependency is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, service]
                    properties:
                      status: { type: string, const: not_ready }
                      service: { type: string, const: oshi-schedule-api }
  /api/v1/me:
    get:
      responses:
        '200': { description: current active user }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: onboarding required }
        '410': { $ref: '#/components/responses/Gone' }
  /api/v1/onboarding:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderToken' } } }
      responses:
        '200': { description: configured }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
  /api/v1/channels:
    get:
      responses:
        '200': { description: subscriptions }
        '410': { $ref: '#/components/responses/Gone' }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateChannel' } } }
      responses:
        '201':
          description: subscription created and initial sync job accepted without waiting for execution
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ChannelRegistrationResult' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '409': { description: duplicate or channel not resolved }
        '422': { description: three-channel limit }
  /api/v1/channels/resolve:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Handle' } } }
      responses:
        '200': { description: resolved channel }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '404': { description: not found }
        '429': { description: YouTube acquisition deferred until the next quota window }
  /api/v1/channels/{subscriptionId}:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    patch:
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/UpdateSubscription' } } }
      responses:
        '200': { description: updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '404': { description: not found or not owned }
    delete:
      responses:
        '204': { description: deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: not found or not owned }
  /api/v1/channels/{subscriptionId}/sync:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      responses:
        '202':
          description: manual sync job accepted without waiting for execution
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SyncRunAccepted' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: not found or not owned }
        '409': { description: subscription is paused }
        '429': { description: cooldown }
        '503': { description: durable job recorded but dispatch failed; request may be retried }
  /api/v1/sync-runs/{syncRunId}:
    parameters: [{ $ref: '#/components/parameters/SyncRunId' }]
    get:
      responses:
        '200':
          description: owned asynchronous sync job status and result summary
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SyncRun' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: not found or not owned }
  /api/v1/sync-status:
    get: { responses: { '200': { description: latest per-subscription status } } }
  /api/v1/google/reconnect:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderToken' } } }
      responses:
        '200': { description: reconnected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '410': { $ref: '#/components/responses/Gone' }
  /api/v1/account:
    delete:
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/DeleteConfirmation' } } }
      responses:
        '204': { description: deletion completed or already complete }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '409': { description: deletion for this subject is already running }
        '502': { description: external deletion step failed; request can be retried }
