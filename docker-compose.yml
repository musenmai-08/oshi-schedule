services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oshi_schedule
      POSTGRES_USER: oshi
      POSTGRES_PASSWORD: oshi_password
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oshi -d oshi_schedule']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
