version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - test -n "$CODEBUILD_SRC_DIR"
            - cd "$CODEBUILD_SRC_DIR"
            - nvm install 22.23.1
            - nvm use 22.23.1
            - corepack enable
            - corepack prepare pnpm@9.15.9 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - test -n "$CODEBUILD_SRC_DIR"
            - cd "$CODEBUILD_SRC_DIR"
            - test "$NEXT_PUBLIC_DEMO_MODE" = "false"
            - test -n "$NEXT_PUBLIC_API_URL"
            - test -n "$NEXT_PUBLIC_SUPABASE_URL"
            - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            - pnpm --workspace-root exec turbo build --filter=@oshi-schedule/web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/.pnpm/**/*
          - apps/web/.next/cache/**/*
